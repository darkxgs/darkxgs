      <stop offset="0" stop-color="#d97b4a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#d97b4a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f2efe6" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="#0b0d10"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <text x="1136" y="276" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#8d877b">ARABIC · ENGLISH · RTL</text>
  </g>
  <text x="64" y="84" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="3" fill="#e8955f">FULL-STACK &amp; MOBILE DEVELOPER · CAIRO, EGYPT</text>
  <text x="62" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2.5" fill="#f2efe6">Seif Ashraf</text>
  <text x="64" y="232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#b9b3a6">I build the systems small businesses <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#e8955f">run on.</tspan></text>
  <rect x="64" y="270" width="56" height="3" rx="1.5" fill="#d97b4a"/>
  <text x="136" y="276" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" fill="#8d877b">seifashraf.dev</text>
